# Stack definition for the Platform team's Komodo deploy. Same shape as
# every other homelab stack: one image, one port, a healthcheck, labels.
# Komodo supplies the actual registry/tag at deploy time; `image` below is
# the name this issue's PR asks Platform to build and push.
#
# Merging this file changes nothing live. It is applied by Komodo, outside
# this repo, by the Platform team — see the handoff comment on ARB-62.
services:
  web:
    image: ghcr.io/jukyokim/mazeosaur-web:latest
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      com.mazeosaur.service: "web"
      com.mazeosaur.repo: "JuKyoKim/mazeosaur"
