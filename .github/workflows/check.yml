name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Both lockfiles, because this key replaces setup-node's default
          # rather than adding to it: dropping the root entry would change
          # the cache key for the main install. These are the only two
          # lockfiles in the repo.
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      - run: npm ci
      # `npm run check` runs the linter first, so this is a second lint run
      # of about a second. It buys a named step in the Actions UI, so a lint
      # failure reads as "lint" instead of as a failure inside "check".
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - name: bundle size budget
        run: npm run check:bundle-size
      - name: art check (colour, contrast, hit targets)
        run: npm run art:check
      - name: art frames regenerate byte-identical
        # tools/art is a deterministic generator; docs/art must be exactly
        # what it produces. --intent-to-add makes an added frame visible to
        # git diff, and diffing against HEAD (not the index) keeps a deleted
        # frame visible too, since --all stages deletions.
        run: |
          npm run art:frames
          git add --all --intent-to-add -- docs/art
          git diff HEAD --exit-code -- docs/art
      - name: no network code in the game bundle
        # Until apps/mobile exists this guards the same bundle the mobile
        # shell will wrap. Phaser's loader references XHR; it is allowed
        # here and will be replaced by an embedded manifest in M3.
        run: |
          set -e
          bundle=$(ls apps/web/dist/assets/*.js | head -50)
          for word in 'WebSocket(' 'EventSource(' 'sendBeacon('; do
            if grep -l -- "$word" $bundle >/dev/null; then
              echo "found $word in the bundle"; exit 1
            fi
          done
          echo "bundle clean of sockets and beacons"

  client-smoke:
    # Separate job from `check`: it boots a real browser against the real
    # dev server, which is slower than the sim's under-a-second budget and
    # has no business gating on the same runner step as typecheck/vitest.
    runs-on: ubuntu-latest
    # The suite takes ~31s. The job waits on a dev server coming up, so a
    # server that never does would otherwise hang on the 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # The same list as `check`, so both jobs compute one cache key and
          # share a single entry. setup-node's default is not a glob: it is
          # the first of package-lock.json / npm-shrinkwrap.json / yarn.lock
          # found in the repo ROOT, so a nested lockfile is picked up by
          # neither job on its own. Add a lockfile, edit both lists.
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:client
      - name: upload playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Builds and pushes the deployable web image only after `check` and
  # `client-smoke` are both green, and only from main — never from a PR,
  # which has no packages:write token.
  # The beelink stack (JuKyoKim/arbor, stacks/beelink/mazeosaur) pins a tag
  # from here; see the ARB-62 handoff comment for the compose diff.
  publish:
    needs: [check, client-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/jukyokim/mazeosaur:${{ github.sha }}
          # The same 40 characters as the tag above, by construction, so the
          # commit the bundle reports and the commit the image is tagged
          # with cannot drift. apps/web/Dockerfile declares ARG BUILD_COMMIT.
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
