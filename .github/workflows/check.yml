name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: no network code in the game bundle
        # Until apps/mobile exists this guards the same bundle the mobile
        # shell will wrap. Phaser's loader references XHR; it is allowed
        # here and will be replaced by an embedded manifest in M3.
        run: |
          set -e
          bundle=$(ls apps/web/dist/assets/*.js | head -50)
          for word in 'WebSocket(' 'EventSource(' 'sendBeacon('; do
            if grep -l -- "$word" $bundle >/dev/null; then
              echo "found $word in the bundle"; exit 1
            fi
          done
          echo "bundle clean of sockets and beacons"

  client-smoke:
    # Separate job from `check`: it boots a real browser against the real
    # dev server, which is slower than the sim's under-a-second budget and
    # has no business gating on the same runner step as typecheck/vitest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:client
      - name: upload playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
