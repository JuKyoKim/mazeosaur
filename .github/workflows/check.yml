name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: bundle size budget
        run: npm run check:bundle-size
      - name: no network code in the game bundle
        # Until apps/mobile exists this guards the same bundle the mobile
        # shell will wrap. Phaser's loader references XHR; it is allowed
        # here and will be replaced by an embedded manifest in M3.
        run: |
          set -e
          bundle=$(ls apps/web/dist/assets/*.js | head -50)
          for word in 'WebSocket(' 'EventSource(' 'sendBeacon('; do
            if grep -l -- "$word" $bundle >/dev/null; then
              echo "found $word in the bundle"; exit 1
            fi
          done
          echo "bundle clean of sockets and beacons"

  # Builds and pushes the deployable web image only after `check` is green,
  # and only from main — never from a PR, which has no packages:write token.
  # The beelink stack (JuKyoKim/arbor, stacks/beelink/mazeosaur) pins a tag
  # from here; see the ARB-62 handoff comment for the compose diff.
  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/jukyokim/mazeosaur:${{ github.sha }}
